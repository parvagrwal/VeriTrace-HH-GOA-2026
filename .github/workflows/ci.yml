name: VeriTrace CI

on:
  push:
    branches: [ main, base-model, frontend ]
  pull_request:
    branches: [ main, base-model, frontend ]

jobs:
  contracts:
    name: Smart Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Compile Contracts
        run: npx hardhat compile

      - name: Run Contract Unit Tests
        run: npx hardhat test

  pipeline:
    name: Core Pipeline & Canonical Hash Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install web3 python-dotenv requests pillow

      - name: Run Hermetic Pipeline Unit Tests
        run: python -m unittest test_pipeline.py

      - name: Run System Health Diagnostic (CI Mode)
        run: python src/health.py --ci
